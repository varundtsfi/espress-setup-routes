name: Node.js CI
permissions: read-all
env:
  NODE_ENV: development
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, development]
  push:
    branches:
      - main
      - development
jobs:
  Lint-and-format-test-ubuntu:
    name: Perform branch name and commit message validation, along with linting and code formatting checks, using the ubuntu-latest environment.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci
      - name: Lint Codebase
        run: npm run lint:check
      - name: Format Codebase
        run: npm run format:check
      - name: Validate Branch name
        run: npm run validate-branch-name $BRANCH_NAME
